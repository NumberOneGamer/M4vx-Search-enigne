name: Cleanup Content

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max content length to keep (chars)'
        required: true
        default: '1200'
        type: number

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Truncate page content
        run: npx tsx scripts/cleanup-content.ts
